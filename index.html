<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>

    <!-- CSS -->
    <link rel="stylesheet" href="todo.css">
</head>

<body>

    <div class="container">
        <h1>To-Do List</h1>

        <!-- Input Section -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Extra DOM -->
        <div id="HelloWorld" class="oldClass">Hello World</div>
        <button id="HelloWorldBtn">Change Class</button>
    </div>

    <!-- JS -->
    <script src="todo.js"></script>
</body>

</html>
